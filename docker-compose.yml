version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: campusexchange_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: campusexchange_db_pass
      POSTGRES_DB: campusexchange
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/config/schema.sql:/docker-entrypoint-initdb.d/init.sql

  app:
    build: .
    container_name: campusexchange_app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET}
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME}
      - DATABASE_URL=postgresql://postgres:campusexchange_db_pass@postgres:5432/campusexchange
    depends_on:
      - postgres

volumes:
  pgdata: